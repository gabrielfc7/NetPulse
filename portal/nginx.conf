# ==========================================
# NetPulse Sentry & Gateway Unified Reverse Proxy
# ==========================================

# 1. Hub / Dashboard (Default fallback)
server {
    listen 80 default_server;
    server_name hub.lan pi.lan pi.local _;

    location / {
        proxy_pass http://homepage:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;

        proxy_set_header Accept-Encoding "";
        sub_filter '</body>' '<script src="/api/config/custom.js"></script></body>';
        sub_filter_once on;
    }

    # Direct access to Sentry Hub portal
    location /portal/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }
}

# 2. NetPulse Pro RF & Network Sentry
server {
    listen 80;
    server_name sentry.lan;

    location / {
        proxy_pass http://172.18.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 86400s;
    }
}

