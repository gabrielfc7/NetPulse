- Sentry Recon & Applications:
    - NetPulse Pro:
        icon: mdi-wifi-check
        href: "http://192.168.1.107:8765"
        description: "24/7 RF Sentry • Automated Channel Optimizer & Wi-Fi Telemetry"
        server: my-docker
        container: netpulse-sentry
        showStats: true
        widget:
          type: customapi
          url: "http://192.168.1.107:8765/api/status"
          mappings:
            - field: wifi.signal_rating
              label: Signal Link
              format: text
            - field: wifi.rx_rate_mbps
              label: Speed
              suffix: " Mbps"
            - field: wifi.default_gateway
              label: Gateway
              format: text

    - God's Eye View:
        icon: mdi-earth
        href: "http://192.168.1.107:4173"
        description: "3D CesiumJS Geospatial Sentry • Satellites, Aircraft ADS-B & Maritime AIS"
        server: my-docker
        container: gods-eye-view-gods-eye-view-1
        showStats: true

    - Pi-hole + Unbound:
        icon: pi-hole.png
        href: "http://192.168.1.107:8088/admin"
        description: "Recursive Unbound Root DNS • 516k+ Domain Privacy Shield"
        server: my-docker
        container: pihole-unbound
        showStats: true
        widget:
          type: pihole
          url: "http://pihole-unbound:80"
          version: 6
          key: "admin"
          fields: ["queries", "blocked", "blocked_percent", "gravity"]

