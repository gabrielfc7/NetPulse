services:
  netpulse:
    build:
      context: .
      dockerfile: Dockerfile
    image: netpulse-pro:latest
    container_name: netpulse-sentry
    restart: unless-stopped
    # Host networking allows direct ICMP ping probes and gateway telemetry
    network_mode: host
    environment:
      - NETPULSE_DOCKER=1
      - NETPULSE_DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  portal:
    image: nginx:alpine
    container_name: pi-portal
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./portal:/usr/share/nginx/html:ro
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

  pihole:
    image: mpgirro/pihole-unbound:latest
    container_name: pihole-unbound
    restart: unless-stopped
    hostname: pihole
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8088:80/tcp"
    environment:
      - TZ=America/Chicago
      - FTLCONF_webserver_port=80
      - FTLCONF_dns_upstreams=127.0.0.1#5335
      - FTLCONF_dns_dnssec=true
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_webserver_api_password=admin
    volumes:
      - ./data/pihole:/etc/pihole
      - ./data/dnsmasq.d:/etc/dnsmasq.d
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - PUID=1000
      - PGID=984
      - HOMEPAGE_ALLOWED_HOSTS=*
    group_add:
      - 984
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "2"

  watchtower:
    image: containrrr/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 0 4 * * *
      - TZ=America/Chicago
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
